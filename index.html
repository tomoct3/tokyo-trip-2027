<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東京 6/12–14</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="東京6月">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <button id="listBtn" class="listBtn" aria-controls="drawer">☰ リスト</button>
  <div class="tabs" role="tablist" aria-label="日付">
    <button data-day="all" class="on">全部</button>
    <button data-day="12">12日<span class="wd"> 土</span></button>
    <button data-day="13">13日<span class="wd"> 日</span></button>
    <button data-day="14">14日<span class="wd"> 月</span></button>
  </div>
  <label class="toggle"><input type="checkbox" id="fixedOnly"> 確定だけ</label>
</header>

<div id="map"></div>

<div id="backdrop" hidden></div>
<nav id="drawer" aria-label="スポット一覧" aria-hidden="true">
  <div class="drawer-head">
    <span id="drawerTitle">スポット</span>
    <button id="drawerClose" aria-label="閉じる">×</button>
  </div>
  <div id="spotList"></div>
  <a class="editLink" href="edit.html">✎ 確定と日程を編集する</a>
</nav>

<div id="tools">
  <button id="refresh" title="最新に更新">↻ 更新</button>
  <button id="locate" title="現在地">◎ 現在地</button>
  <button id="pairBtn">⇄ 2地点</button>
  <button id="legendBtn">凡例</button>
</div>

<div id="pairPanel" hidden>
  <p id="pairMsg">出発地のピンを押してください</p>
  <div class="pairActions" hidden>
    <a id="pairApple" class="btn primary" target="_blank" rel="noopener">Appleマップで行き方</a>
    <a id="pairGoogle" class="sub" target="_blank" rel="noopener">Googleマップ</a>
  </div>
  <button id="pairClose" class="close">やめる</button>
</div>

<div id="legend" hidden>
  <div class="row"><span class="dot" style="--c:var(--venue)">会</span>会場</div>
  <div class="row"><span class="dot" style="--c:var(--stay)">宿</span>宿</div>
  <div class="row"><span class="dot" style="--c:var(--art)">美</span>美術館・建築</div>
  <div class="row"><span class="dot" style="--c:var(--food)">食</span>食事</div>
  <div class="row"><span class="dot" style="--c:var(--station)">駅</span>駅</div>
  <div class="row"><span class="dot" style="--c:var(--transport)">空</span>空港</div>
  <hr>
  <div class="row"><span class="dot" style="--c:#555">確</span>濃い色＝確定</div>
  <div class="row"><span class="dot cand" style="--c:#555">候</span>薄い色＝候補</div>
  <p class="note" id="updated"></p>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
